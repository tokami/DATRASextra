development:
  mode: auto

articles:
- title: Tutorial
  navbar: ~
  contents: tutorial
- title: By length
  navbar: ~
  contents: by_length
- title: Prediction grid
  navbar: ~
  contents: survey_domain
- title: FishGlob
  navbar: ~
  contents: fishglob
