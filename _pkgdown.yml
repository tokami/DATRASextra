url: https://tokami.github.io/DATRASextra

home:
  title: Extra functions for DATRAS R package

authors:
  Tobias Mildenberger:
    href: https://github.com/tokami
  Federico Maioli:
    href: https://github.com/federico-maioli
  Casper Berg:
    href: https://github.com/casperwberg

template:
  bootstrap: 5
  math-rendering: mathjax
  light-switch: true
  bslib:
    primary: '#0054AD'
    border-radius: 0.5rem
    btn-border-radius: 0.25rem
    danger: '#A6081A'
  assets:
  - pkgdown/extra.css

development:
  mode: auto

navbar:
  structure:
    left:  [reference, articles, news]
    right: [search, github, lightswitch]

articles:
- title: Getting started
  contents:
  - datrasextra-tutorial
  - articles/plot-datras-overview
  - articles/define-survey-domain
- title: Advanced
  contents:
  - articles/custom-length-classes
  - articles/exploring-length-at-age
- title: FishGlob
  contents:
  - articles/fishglob

news:
  releases:
  - text: Version 0.0.0.9000
    href: https://github.com/tokami/DATRASextra/blob/main/NEWS.md
