url: https://tokami.github.io/DATRASextra

home:
  title: Extra functions for DATRAS R package

authors:
  Tobias Mildenberger:
    href: https://github.com/tokami
  Federico Maioli:
    href: https://github.com/federico-maioli
  Casper Berg:
    href: https://github.com/casperwberg

template:
  bootstrap: 5
  math-rendering: mathjax
  light-switch: true
  bslib:
    base_font: {google: "Roboto"}
    heading_font: {google: "Roboto Slab"}
    code_font: {google: "JetBrains Mono"}
    primary: '#0054AD'
    border-radius: 0.5rem
    btn-border-radius: 0.25rem
    danger: '#A6081A'
  assets:
  - pkgdown/extra.css

development:
  mode: auto

navbar:
  structure:
    left:  [reference, articles, news]
    right: [search, github, lightswitch]

articles:
- title: Getting started
  contents:
  - articles/datras-raw-object
  - datrasextra-tutorial
  - articles/plot-datras-overview
  - articles/make_spatiotemporal_grid
- title: Advanced
  contents:
  - articles/custom-length-classes
- title: FishGlob
  contents:
  - articles/fishglob
- title: Common data workflows
  contents:
  - articles/number-biomass-by-species
  - articles/number-biomass-effort-by-species
  - articles/match-emodnet-habitats


news:
  releases:
  - text: Version 0.3.0
    href: https://github.com/tokami/DATRASextra/blob/main/NEWS.md
