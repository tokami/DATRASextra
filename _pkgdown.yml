url: https://tokami.github.io/DATRASextra

home:
  title: Extra functions for DTU Aquas DATRAS R package

authors:
  Tobias Mildenberger:
    href: https://github.com/tokami
  Federico Maioli:
    href: https://github.com/federico-maioli
  Casper Berg:
    href: https://github.com/casperwberg

template:
